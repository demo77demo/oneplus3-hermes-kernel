name: Build OnePlus 3 Hermes Kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget unzip bc bison flex libssl-dev \
            libelf-dev make clang lld llvm ccache python3 zip
      
      - name: Download kernel source
        run: |
          git clone --depth 1 -b lineage-18.1 https://github.com/LineageOS/android_kernel_oneplus_msm8996.git kernel
          echo "Kernel source downloaded"
          ls kernel/arch/arm64/configs/ | grep -i oneplus
      
      - name: Download AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          echo "AnyKernel3 downloaded"
      
      - name: Download toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          # AOSP Clang
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-r547379
          cd ..
          # GCC 64-bit
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          # GCC 32-bit
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32
          echo "Toolchains downloaded"
      
      - name: Apply kernel config patches
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/oneplus3_defconfig"
          
          # Check if defconfig exists
          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: $DEFCONFIG not found"
            ls arch/arm64/configs/
            # Try to find any oneplus defconfig
            DEFCONFIG=$(ls arch/arm64/configs/ | grep -i oneplus | head -1)
            if [ -z "$DEFCONFIG" ]; then
              echo "No oneplus defconfig found, using first available"
              DEFCONFIG=$(ls arch/arm64/configs/ | head -1)
            fi
            DEFCONFIG="arch/arm64/configs/$DEFCONFIG"
            echo "Using: $DEFCONFIG"
          fi
          
          # Enable ZRAM and memory optimizations
          cat >> "$DEFCONFIG" << 'EOF'
          
          # Hermes Kernel - Memory Optimizations
          CONFIG_ZRAM=y
          CONFIG_ZSMALLOC=y
          CONFIG_ZSWAP=y
          CONFIG_ZPOOL=y
          CONFIG_KSM=y
          CONFIG_COMPACTION=y
          CONFIG_CMA=y
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          EOF
          
          echo "Config patches applied to $DEFCONFIG"
          echo "=== Memory-related config ==="
          grep -E "ZRAM|ZSMALLOC|ZSWAP|KSM|COMPACTION|CMA|LRU_GEN" "$DEFCONFIG" || echo "Some configs may not be available in this kernel version"
      
      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$PWD/../gcc64/bin/aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=$PWD/../toolchain/clang-r547379/bin/clang
          export LD=$PWD/../toolchain/clang-r547379/bin/ld.lld
          export AR=$PWD/../toolchain/clang-r547379/bin/llvm-ar
          export NM=$PWD/../toolchain/clang-r547379/bin/llvm-nm
          export OBJCOPY=$PWD/../toolchain/clang-r547379/bin/llvm-objcopy
          export OBJDUMP=$PWD/../toolchain/clang-r547379/bin/llvm-objdump
          export STRIP=$PWD/../toolchain/clang-r547379/bin/llvm-strip
          
          # Use ccache
          export PATH="/usr/lib/ccache:$PATH"
          
          # Find defconfig
          DEFCONFIG=$(ls arch/arm64/configs/ | grep -i oneplus | head -1)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG=$(ls arch/arm64/configs/ | head -1)
          fi
          DEFCONFIG="arch/arm64/configs/$DEFCONFIG"
          echo "Using defconfig: $DEFCONFIG"
          
          make clean
          make mrproper
          make $(basename $DEFCONFIG)
          
          # Build
          make -j$(nproc) 2>&1 | tail -30
          
          echo "=== Build complete ==="
          echo "=== Kernel images ==="
          find arch/arm64/boot -name "Image*" -type f -exec ls -lh {} \;
      
      - name: Package with AnyKernel3
        run: |
          # Find kernel image - be thorough, msm8996 can produce various names
          echo "=== All files in boot dir ==="
          find kernel/arch/arm64/boot -type f 2>/dev/null || echo "No boot dir found"
          echo "=== Searching entire kernel tree for Image* ==="
          find kernel -name "Image*" -type f 2>/dev/null | head -20
          
          KERNEL_IMG=""
          for candidate in \
            "kernel/arch/arm64/boot/Image.gz-dtb" \
            "kernel/arch/arm64/boot/Image.gz" \
            "kernel/arch/arm64/boot/Image" \
            "kernel/arch/arm64/boot/bzImage"; do
            if [ -f "$candidate" ]; then
              KERNEL_IMG="$candidate"
              break
            fi
          done
          
          # Fallback: find any Image file in boot dir
          if [ -z "$KERNEL_IMG" ]; then
            KERNEL_IMG=$(find kernel/arch/arm64/boot -name "Image*" -type f 2>/dev/null | head -1)
          fi
          # Fallback: find any Image file anywhere
          if [ -z "$KERNEL_IMG" ]; then
            KERNEL_IMG=$(find kernel -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" 2>/dev/null | grep -v ".dtb$" | head -1)
          fi
          
          if [ -z "$KERNEL_IMG" ]; then
            echo "ERROR: No kernel image found"
            echo "=== Full kernel tree ==="
            find kernel -type f -name "*.o" | head -5
            echo "=== Checking if build actually ran ==="
            ls -la kernel/arch/arm64/boot/ 2>/dev/null || echo "No boot dir"
            exit 1
          fi
          
          echo "Using kernel image: $KERNEL_IMG"
          ls -lh "$KERNEL_IMG"
          cp "$KERNEL_IMG" AnyKernel3/
          
          # Create AnyKernel3 config
          cat > AnyKernel3/anykernel.sh << 'AKEOF'
          # AnyKernel3 Configuration for OnePlus 3
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=oneplus3
          device.name2=OnePlus3
          device.name3=ONEPLUS A3003
          device.name4=oneplus3t
          device.name5=OnePlus3T
          block=/dev/block/bootdevice/by-name/boot
          is_slot_device=0
          ramdisk_compression=auto
          AKEOF
          
          # Package ZIP
          cd AnyKernel3
          ZIP_NAME="HermesKernel-OP3-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP_NAME" . -x "*.git*" "*.md" "LICENSE"
          cd ..
          
          echo "ZIP created: $ZIP_NAME"
          ls -lh "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hermes-kernel-${{ github.run_number }}
          name: "Hermes Kernel for OnePlus 3 (Build #${{ github.run_number }})"
          body: |
            ## Hermes Kernel for OnePlus 3
            
            Custom kernel built with GitHub Actions.
            
            ### Features
            - ZRAM (compressed RAM swap)
            - KSM (Kernel Samepage Merging)
            - Optimized memory management
            - CMA (Contiguous Memory Allocator)
            - LRU Gen (better page reclaim)
            
            ### Installation
            1. Download the ZIP
            2. Boot to TWRP
            3. Flash the ZIP
            4. Reboot
            
            ### Build Info
            - Source: LineageOS android_kernel_oneplus_msm8996 (lineage-18.1)
            - Clang: r547379
            - Build: ${{ github.run_id }}
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
